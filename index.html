<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
        
        <!-- 1. SOSTITUISCI 'simbolo.patt' con il nome esatto del tuo file scaricato -->
        <a-marker type="pattern" url="simbolo.patt" id="mioMarker">
            
            <!-- Questo cubo rosso serve per capire SE il marker viene visto. 
                 Se vedi il cubo ma non la scritta, il problema è il database. -->
            <a-box position='0 0.5 0' material='opacity: 0.5; color: red;' scale="0.5 0.5 0.5"></a-box>

            <a-entity 
                id="testo-dinamico"
                position="0 1 0" 
                rotation="-90 0 0"
                scale="5 5 5"
                text="value: TEST CONNESSIONE...; color: yellow; align: center;">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const API_URL = "INSERISCI_QUI_IL_TUO_URL_DI_GOOGLE_APPS_SCRIPT";

        // Funzione per testare se il marker viene rilevato
        const m = document.querySelector('#mioMarker');
        m.addEventListener('markerFound', () => {
            console.log("Marker trovato!");
        });

        async function aggiornaTesto() {
            try {
                const response = await fetch(API_URL);
                const dati = await response.json();
                const riga = dati.find(item => item.id == 1);
                if(riga) {
                    document.querySelector('#testo-dinamico').setAttribute('text', 'value', riga.testo);
                }
            } catch (error) {
                console.error("Errore:", error);
                document.querySelector('#testo-dinamico').setAttribute('text', 'value', "ERRORE DATABASE");
            }
        }

        aggiornaTesto();
        setInterval(aggiornaTesto, 5000);
    </script>
</body>
</html>
